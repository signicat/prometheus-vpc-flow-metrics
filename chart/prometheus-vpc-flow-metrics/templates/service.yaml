apiVersion: v1
kind: Service
metadata:
  name: {{ include "prometheus-vpc-flow-metrics.fullname" . }}
  labels:
    {{- include "prometheus-vpc-flow-metrics.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 8 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
{{ if .Values.metrics.port }}
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: http-metrics
{{ end }}
  selector:
    {{- include "prometheus-vpc-flow-metrics.selectorLabels" . | nindent 4 }}
